<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planeta Surf — Ropa y accesorios</title>
    <meta name="description" content="Planeta Surf: ropa y accesorios para vivir tu día a tu manera. Nuevos ingresos, sale de invierno y toda la colección." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/tailwind-build.css" />
  </head>
  <body class="bg-brand-paper text-primary">
    <div data-topbar class="ps-topbar"></div>
    <header data-header class="ps-header sticky top-0 z-20"></header>

    <main>
      <!-- HERO -->
      <section class="ps-hero">
        <div class="mx-auto grid max-w-[1440px] gap-0 px-4 py-10 sm:px-6 lg:grid-cols-[minmax(0,420px)_1fr] lg:items-start lg:gap-10 lg:pb-2 lg:pt-0">
          <div>
            <h1 id="heroTitulo" class="font-display whitespace-pre-line text-[2.75rem] leading-[0.95] sm:text-[3.5rem]"></h1>
            <p id="heroSubtitulo" class="mt-4 max-w-sm text-base text-secondary"></p>
            <div class="mt-6 flex flex-wrap gap-3">
              <a id="heroCtaPrimario" href="/productos" class="btn-primary px-6 py-3 text-xs uppercase tracking-wide">Ver colección</a>
              <a id="heroCtaSecundario" href="/productos" class="ps-btn-outline">Nuevos ingresos</a>
            </div>
          </div>
          <div class="mt-4 lg:mt-0">
            <div id="heroGallery" class="ps-scroll-row flex gap-2 overflow-x-auto sm:grid sm:grid-cols-4 sm:overflow-visible"></div>
            <div id="heroDots" class="mt-3 flex justify-center gap-1.5 sm:hidden"></div>
          </div>
        </div>
      </section>

      <!-- BENEFICIOS -->
      <section class="ps-benefits">
        <div class="mx-auto grid max-w-[1440px] grid-cols-1 gap-6 px-4 py-6 text-sm sm:grid-cols-3 sm:justify-items-center sm:px-6">
          <div class="flex items-center gap-3">
            <svg viewBox="0 0 24 24" class="h-6 w-6 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="7" width="15" height="10" rx="1"/><path d="M16 10h4l3 3v4h-7z"/><circle cx="6" cy="19" r="1.5"/><circle cx="18" cy="19" r="1.5"/></svg>
            <div>
              <div id="beneficio1Titulo" class="font-semibold uppercase tracking-wide"></div>
              <div id="beneficio1Subtitulo" class="text-meta"></div>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <svg viewBox="0 0 24 24" class="h-6 w-6 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
            <div>
              <div id="beneficio2Titulo" class="font-semibold uppercase tracking-wide"></div>
              <div id="beneficio2Subtitulo" class="text-meta"></div>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <svg viewBox="0 0 24 24" class="h-6 w-6 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2 4 5v6c0 5 3.4 8.8 8 11 4.6-2.2 8-6 8-11V5z"/></svg>
            <div>
              <div id="beneficio3Titulo" class="font-semibold uppercase tracking-wide"></div>
              <div id="beneficio3Subtitulo" class="text-meta"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- NUEVOS INGRESOS -->
      <section class="mx-auto max-w-[1440px] px-4 py-10 sm:px-6">
        <div class="mb-5 flex items-end justify-between">
          <h2>Destacados</h2>
          <a href="/productos" class="text-meta font-semibold hover:text-brand-ink">Ver todo →</a>
        </div>
        <div id="destacadosGrid" class="grid grid-cols-2 gap-x-4 gap-y-8 sm:grid-cols-3 lg:grid-cols-6"></div>
        <p id="destacadosVacio" class="hidden text-meta">Todavía no hay productos cargados en la Home.</p>
      </section>

      <!-- CATEGORÍAS -->
      <section class="mx-auto max-w-[1440px] pb-14">
        <div id="categoriasGrid" class="ps-scroll-row flex gap-3 overflow-x-auto px-4 sm:px-6"></div>
      </section>
    </main>

    <footer data-footer class="border-t border-brand-line"></footer>

    <script src="/js/common.js"></script>
    <script src="/js/home.js"></script>
  </body>
</html>
